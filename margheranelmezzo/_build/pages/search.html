<section class="band">
  <div class="band__inner band__inner--split">
    <div>
      <h1 data-i18n="gallery.h1">Galleria</h1>
      <p class="band__lede" data-i18n="gallery.lede">Tutte le opere di Marghera nel Mezzo. Cerca, filtra per tipo o ordina per anno.</p>
    </div>
    <a class="pill-add" href="upload.html">+ <span data-i18n="gallery.add">Aggiungi la tua opera</span></a>
  </div>
</section>

<div class="wrap gal-main">
  <div class="controls">
    <label class="search">
      <span class="sr-only" data-i18n="gallery.searchLabel">Cerca</span>
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.5" cy="8.5" r="6" stroke="#141210" stroke-width="2.5"/><line x1="13" y1="13" x2="18" y2="18" stroke="#141210" stroke-width="2.5" stroke-linecap="round"/></svg>
      <input type="search" id="q" autocomplete="off" placeholder="Cerca un titolo o un autore" data-i18n-attr="placeholder:gallery.searchPh">
    </label>

    <!-- Phones: "Filtri" opens a small panel with sort and type. On computers the panel's contents sit in the page as before. -->
    <button type="button" class="filters-btn" id="filters-btn" aria-expanded="false" aria-controls="filters-panel">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="6" r="2"/><path d="M4 6h8M16 6h4"/><circle cx="8" cy="12" r="2"/><path d="M4 12h2M10 12h10"/><circle cx="17" cy="18" r="2"/><path d="M4 18h11M19 18h1"/></svg>
      <span data-i18n="gallery.filters">Filtri</span>
      <span class="filters-btn__n" id="filters-n" hidden></span>
    </button>
    <div class="filters-panel" id="filters-panel">
      <label class="select-pill select-pill--sort">
        <span data-i18n="gallery.sortLabel">Ordina</span>
        <select id="sort">
          <option value="new" data-i18n="gallery.sorts.new">Anno: dal più recente</option>
          <option value="old" data-i18n="gallery.sorts.old">Anno: dal più vecchio</option>
          <option value="author" data-i18n="gallery.sorts.author">Autore A–Z</option>
          <option value="title" data-i18n="gallery.sorts.title">Titolo A–Z</option>
        </select>
      </label>
      <div class="filters-panel__types">
        <span class="filters-panel__label" aria-hidden="true" data-i18n="gallery.typeLabel">Tipo</span>
        <div class="chips" id="chips" role="group" aria-label="Filtra per tipo" data-i18n-attr="aria-label:gallery.filterLabel"></div>
      </div>
    </div>

    <div class="seg" role="group" aria-label="Vista" data-i18n-attr="aria-label:gallery.viewLabel">
      <button type="button" data-view="grid" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg> <span class="seg__txt" data-i18n="gallery.grid">Griglia</span></button>
      <button type="button" data-view="list" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="4.5" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="4.5" cy="18" r="1.6" fill="currentColor" stroke="none"/><path d="M9.5 6H21M9.5 12H21M9.5 18H21"/></svg> <span class="seg__txt" data-i18n="gallery.list">Elenco</span></button>
    </div>
    <div class="count">
      <span id="count" aria-live="polite"></span>
      <!-- Phones: the order is shown here and can be changed by tapping it -->
      <label class="count__sort"><span class="count__sep" aria-hidden="true">·</span><span class="count__sort-txt" id="sort-txt">dal più recente</span><span class="count__caret" aria-hidden="true">▾</span>
        <select id="sort-m" aria-label="Ordina" data-i18n-attr="aria-label:gallery.sortLabel">
          <option value="new" data-i18n="gallery.sorts.new">Anno: dal più recente</option>
          <option value="old" data-i18n="gallery.sorts.old">Anno: dal più vecchio</option>
          <option value="author" data-i18n="gallery.sorts.author">Autore A–Z</option>
          <option value="title" data-i18n="gallery.sorts.title">Titolo A–Z</option>
        </select>
      </label>
    </div>
  </div>

  <div id="results"></div>
</div>
