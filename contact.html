<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact</title>
<link rel="stylesheet" href="../styles.css">

  <style>
    :root {
      --primary: #4d8ef0;
      --primary-light: #D9D9D9;
      --secondary: #080F3A;
      --accent: #88DADE;
      --accent-secondary: #f06292;
      --neutral: #080F3A;
      --text: #ffffff;
    }


    /* --- Core Fixed Footer Styles --- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%; /* Make html and body take full viewport height */
      font-family: 'Montserrat', sans-serif;
      background-image: url('IMAGES/impact-speaking-about.jpeg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      overflow: hidden; /* Keep overflow hidden on body to prevent overall page scroll */
    }

    body {
      display: flex; /* Make body a flex container */
      flex-direction: column; /* Stack children vertically */
    }

/* === Desktop (≥981px): sidebar on top, content below === */
@media (min-width: 981px) {
  .main-layout-container {
    display: flex;
    flex-direction: column;   /* stack vertically */
    min-height: 0;            /* allow the content pane to flex/scroll */
    padding: 2rem 0 0 3rem;
  }

  .sidebar {
        flex: 0 0 auto;           /* natural height */
        width: 100%;
        max-width: none;
        padding: 2rem 2rem 1rem;
        text-align: left;
      }


      .content {
        flex: 1 1 auto;           /* fill remaining height */
        overflow-y: auto;         /* scrolls inside content */
        margin: 0 auto;           /* center the narrow column */
        max-width: 30rem;
        max-height: none;         /* remove 35rem cap on desktop */
      }
    }

    .sidebar .title {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-secondary);
      margin-bottom: 2rem;
      letter-spacing: 0.2rem;
    }


    .side img{
      width: 30vh;
      margin-top: 1rem;
      margin-bottom: 1rem;
      border-radius: 8px;
    }
    .content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 3rem 2rem;
      box-sizing: border-box;
      color: var(--text);
      max-width: 30rem;
      margin: 0;
      margin-bottom: 10rem;
    }
    .project-description {
      margin: 3rem 0;
      line-height: 1.6;
      text-align: left;
      letter-spacing: 0.05rem;
      margin-top: 0;
      font-size: 1.2rem;
      font-weight: 300;
    }

    .content .project-description a {
        text-decoration: none;
        color: var(--accent);
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      /* --- Media Queries --- */
      @media (max-width: 980px) {
      /* On small screens, we generally want the whole page to scroll if content is long */
      html, body {
        overflow: auto;                 /* page scrolls normally */
        height: auto;                   /* allow body to grow with content */
        min-height: 100%;
        background: #000 !important;    /* force solid black */
        background-image: none !important;
        background-attachment: scroll !important;
      }
      body {
          flex-direction: column; /* Keep column direction */
      }
      .main-layout-container {
        display: block;
        width: 100%;
        min-height: 100vh;              /* ensure at least one viewport tall */
        background: transparent;
      }

      .sidebar {
        height: 5rem;
        border-right: none;
        padding: 1.3rem 0 0;         /* tidy padding */
        text-align: left;
        background-color: var(--neutral);
        position: fixed;
        align-items: flex-start;
        top: 0;
        z-index: 1000;
        width: 100vw;
        box-sizing: border-box;
        text-align: left !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        overflow-wrap: anywhere; /* break very long tokens if needed */
       }

       .sidebar .title {
        margin-left: 1rem;
       }
       .content {
        max-width: 100%;
        max-height: none !important;    /* no clipping on mobile */
        overflow: visible;
        background: transparent;        /* let black body show through */
        margin: 0;
        padding: 5rem 5rem;
      }

      .content .project-description {
        margin: 0;
        line-height: 1.6;
        text-align: left;
      }

      .content .project-description img {
        height: auto;
        width: 100%;
        margin-bottom: 0.5rem;
        padding: 0;
      }
    }

    /* The bottom-space is no longer needed with a fixed footer */
    .bottom-space {
      display: none;
    }

  </style>
</head>
<body class="contact">
  <div class="main-layout-container">
    <div class="sidebar">
      <div class="title">CONTACT</div>
    </div>

    <div class="content">
      <div class="project-description">
        <p>Chiara is always open to new collaborations, guest lectures, or event facilitation opportunities.<br><br>If you’re interested in hiring them or want to talk more, feel free to reach out.<br><br></p>
        <p>&nbsp;&nbsp;→&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<a href="mailto:chiaraportinari@outlook.com">chiaraportinari@outlook.com</a></p>
      </div>
      <br>
      <br>
      <br>
    </div>

  
  </div>
  <div id="footer-container"></div>
  <script src="../script.js"></script>
  <div class="photo-credit desktop-only">
    Image credits <a href="https://berenice.guzzophotos.com/about/" target="_blank" rel="noopener">Berenice Guzzo</a>
  </div>
</body>
</html>
